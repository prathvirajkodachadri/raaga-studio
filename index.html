<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f1e1">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Free in-browser studio for Kannada music: Suno prompt builder, raga reference, vocal EQ cheat sheet, mix and master check, tempo lab and more.">
  <meta name="keywords" content="Raaga Studio, Kannada music, Suno prompt builder, vocal EQ, mix check, master check, raga reference, tempo lab">
  <title>Raaga Studio · Compose → Mix → Master</title>
</head>
<body>
  <!-- Restored minimal document shell; page content is loaded by the existing site assets. -->
  <header class="topbar">
    <div class="brand"><h1>Raaga Studio <span class="brand-flow">· Compose → Mix → Master</span></h1></div>
  </header>
  <main id="studio-tools">
    <section class="wrap" id="tab-prosody">
      <h2 class="sec">ಸ್ಕ್ಯಾನರ್ (Scanner)</h2>
      <div class="legend-row">
        <span class="chip"><span class="box laghu-c">U</span> ಲಘು · 1 ಮಾತ್ರೆ</span>
        <span class="chip"><span class="box guru-c">—</span> ಗುರು · 2 ಮಾತ್ರೆ</span>
        <span class="chip"><span class="box pluta-c">3</span> ಪ್ಲುತ · 3 ಮಾತ್ರೆ</span>
        <span class="chip"><span class="box none-c">·</span> ಚಿಹ್ನೆ ಇಲ್ಲ (halant)</span>
      </div>
      <div class="controls">
        <label class="chk"><input type="checkbox" id="shatpadi"><span>ಷಟ್ಪದಿ (3ನೇ &amp; 6ನೇ ಸಾಲಿನ ಕೊನೆಯ ಅಕ್ಷರವನ್ನು ಗುರುವೆಂದು)</span></label>
        <button class="btn primary" id="loadDemo">ಲೋಡ್ ಉದಾಹರಣೆಗಳು</button>
        <button class="btn" id="clear">ಅಳಿಸು</button>
        <button class="btn primary" id="copyAll" type="button">Copy All — entire poem</button>
      </div>
      <div class="cols">
        <div class="panel">
          <label for="input" class="hint">ಕನ್ನಡ ಪದ್ಯ / ಸಾಲುಗಳು</label>
          <textarea id="input" spellcheck="false" placeholder="ಕನ್ನಡದಲ್ಲಿ ಬರೆಯಿರಿ…"></textarea>
        </div>
        <div class="panel output">
          <span class="hint">ಗುರುತು ಮಾಡಿದ ಫಲಿತಾಂಶ — Tab separator shown as |</span>
          <div id="result"></div>
        </div>
      </div>
      <div id="prosody-flash" class="prosody-flash" role="status" aria-live="polite"></div>
      <h2 class="sec">ನಿಯಮಗಳು (ಮಾತ್ರೆ-ಲಘು-ಗುರು)</h2>
      <div id="rules"></div>
    </section>
  </main>
  <script src="js/prosody.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
